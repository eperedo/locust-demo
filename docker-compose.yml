services:
  master:
    image: locustio/locust
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --master --users 1 --spawn-rate 1
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: locustio/locust
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locustfile.py --worker --master-host master
    extra_hosts:
      - "host.docker.internal:host-gateway"
